name: Update GT7 Vehicle Database

on:
  schedule:
    # Run every Monday at 3 AM UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:  # Allow manual triggers
  push:
    paths:
      - 'scraper.py'
      - 'requirements.txt'

jobs:
  update-database:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run scraper
        run: python scraper.py
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet public/vehicles.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/vehicles.json
          git commit -m "🤖 Auto-update vehicle database"
          git push
      
      - name: Create summary
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          echo "✅ Vehicle database updated successfully!" >> $GITHUB_STEP_SUMMARY
          echo "📊 Check public/vehicles.json for changes" >> $GITHUB_STEP_SUMMARY
      
      - name: No changes summary
        if: steps.check_changes.outputs.changes == 'false'
        run: |
          echo "ℹ️ No changes detected in vehicle database" >> $GITHUB_STEP_SUMMARY
